name: Tag release version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "app.json expo.version must use basic SemVer MAJOR.MINOR.PATCH; received $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create immutable version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            tagged_sha=$(git rev-list -n 1 "$tag")
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "$tag already exists (points to $tagged_sha); version unchanged, skipping"
              exit 0
            fi
            echo "$tag already points to this commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Release $VERSION"
          git push origin "$tag"
