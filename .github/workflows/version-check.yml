name: Validate release version

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a higher SemVer release version for code changes
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const parseVersion = (value, label) => {
            if (typeof value !== 'string' || !semverPattern.test(value)) {
              throw new Error(`${label} must use basic SemVer MAJOR.MINOR.PATCH; received ${value}`);
            }
            return value.split('.').map(Number);
          };
          const compare = (left, right) => {
            for (let index = 0; index < left.length; index += 1) {
              if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
            }
            return 0;
          };

          // A version bump is required only when the PR touches code or build
          // config. Docs-only/CI-only PRs may merge without a bump.
          const codePattern =
            /^(app\/|src\/|assets\/|app\.json$|package\.json$|eas\.json$|tsconfig\.json$|eslint\.config\.|babel\.config\.|metro\.config\.|index\.)/;
          const changedFiles = execFileSync('git', ['diff', '--name-only', `${process.env.BASE_SHA}...HEAD`], {
            encoding: 'utf8',
          })
            .split('\n')
            .map((line) => line.trim())
            .filter(Boolean);
          const codeFiles = changedFiles.filter((file) => codePattern.test(file));

          const currentApp = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo.version;
          const currentPackageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const currentPackage = currentPackageJson.version;
          const baseApp = JSON.parse(
            execFileSync('git', ['show', `${process.env.BASE_SHA}:app.json`], { encoding: 'utf8' })
          ).expo.version;
          const basePackageJson = JSON.parse(
            execFileSync('git', ['show', `${process.env.BASE_SHA}:package.json`], { encoding: 'utf8' })
          );
          const basePackage = basePackageJson.version;

          // The distribution helper is CI configuration, not an app release.
          // Permit changing only that script without forcing a version bump.
          const withoutDistributionScript = (packageJson) => {
            const copy = JSON.parse(JSON.stringify(packageJson));
            if (copy.scripts) delete copy.scripts['distribute:android'];
            return copy;
          };
          const packageOnlyCiChange =
            changedFiles.includes('package.json') &&
            JSON.stringify(withoutDistributionScript(currentPackageJson)) ===
              JSON.stringify(withoutDistributionScript(basePackageJson));
          const needsBump = codeFiles.length > 0 && !packageOnlyCiChange;

          const current = parseVersion(currentApp, 'app.json expo.version');
          const currentPackageParts = parseVersion(currentPackage, 'package.json version');
          const base = parseVersion(baseApp, 'base app.json expo.version');
          const basePackageParts = parseVersion(basePackage, 'base package.json version');

          if (currentApp !== currentPackage) {
            throw new Error(`app.json (${currentApp}) and package.json (${currentPackage}) must match`);
          }
          if (baseApp !== basePackage) {
            throw new Error(`main has mismatched versions: app.json (${baseApp}) and package.json (${basePackage})`);
          }

          if (needsBump) {
            if (compare(current, base) <= 0 || compare(currentPackageParts, basePackageParts) <= 0) {
              throw new Error(
                `This PR touches code (${codeFiles.join(', ')}) so its version ${currentApp} must be higher ` +
                  `than main version ${baseApp}`
              );
            }
            console.log(`Code changed; version ${currentApp} is valid and higher than main's ${baseApp}.`);
          } else {
            if (compare(current, base) < 0 || compare(currentPackageParts, basePackageParts) < 0) {
              throw new Error(`Version downgrade is not allowed: PR version ${currentApp} < main version ${baseApp}`);
            }
            if (currentApp !== baseApp) {
              console.log(`Non-code change with optional version bump ${baseApp} -> ${currentApp}; accepted.`);
            } else {
              console.log('Non-code change with no version bump; accepted.');
            }
          }
          NODE
