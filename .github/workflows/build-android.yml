name: Build & Release Android (Local)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases
  id-token: write # needed for keyless Google Cloud authentication

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      FIREBASE_PROJECT_ID: randomprojects-198e3
      FIREBASE_ANDROID_APP_ID: 1:212760278503:android:0bb3be8ff4c4369ad6b942
      GCP_WIF_PROVIDER: projects/212760278503/locations/global/workloadIdentityPools/github/providers/monopoly-helper
      GCP_SERVICE_ACCOUNT: github-actions-firebase@randomprojects-198e3.iam.gserviceaccount.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud for Firebase
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.26.0

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify EXPO_TOKEN is present
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set in GitHub repository secrets. Please add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm config set legacy-peer-deps true
          npm install --legacy-peer-deps

      - name: Test & typecheck
        run: npm test && npm run typecheck

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build Android APK (Local runner)
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output=monopoly-banker-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: monopoly-banker-android-apk
          path: monopoly-banker-preview.apk
          retention-days: 14

      - name: Generate update manifest
        id: manifest
        run: |
          version=$(node -p "require('./app.json').expo.version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="build-android-${{ github.run_number }}"
          apk="monopoly-banker-preview.apk"
          VERSION="$version" \
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${tag}/${apk}" \
          SIZE="$(stat -c%s "$apk")" \
          SHA256="$(sha256sum "$apk" | cut -d' ' -f1)" \
          node --input-type=module -e "
            import { writeFileSync } from 'node:fs';
            writeFileSync('update.json', JSON.stringify({
              version: process.env.VERSION,
              apkUrl: process.env.APK_URL,
              size: Number(process.env.SIZE),
              sha256: process.env.SHA256,
              notes: 'Monopoly Banker ' + process.env.VERSION + ' for Android',
            }, null, 2) + '\n');
          "
          cat update.json

      - name: Distribute APK to Firebase App Distribution
        run: |
          firebase appdistribution:distribute monopoly-banker-preview.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups family \
            --release-notes "Monopoly Banker v${{ steps.manifest.outputs.version }} for Android (commit $GITHUB_SHA)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-android-${{ github.run_number }}
          name: "Android v${{ steps.manifest.outputs.version }} (#${{ github.run_number }})"
          body: |
            Monopoly Banker v${{ steps.manifest.outputs.version }} for Android (commit ${{ github.sha }}, compiled locally on GitHub Actions runner).
            The app checks for updates itself on launch; or download and sideload `monopoly-banker-preview.apk` manually.
          files: |
            monopoly-banker-preview.apk
            update.json
          make_latest: true
