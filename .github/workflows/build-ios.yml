name: Build & Release iOS (Local, On-Demand)

on:
  workflow_dispatch:

permissions:
  contents: write # needed to create or update GitHub Releases

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify EXPO_TOKEN is present
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set in GitHub repository secrets. Please add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm config set legacy-peer-deps true
          npm install --legacy-peer-deps

      - name: Test & typecheck
        run: npm test && npm run typecheck

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build iOS IPA (Local runner)
        run: |
          eas build \
            --platform ios \
            --profile preview \
            --local \
            --non-interactive \
            --output=monopoly-banker-preview.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: monopoly-banker-ios-ipa
          path: monopoly-banker-preview.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-ios-${{ github.run_number }}
          name: "iOS Preview #${{ github.run_number }}"
          body: |
            Automated iOS IPA build from commit ${{ github.sha }} (compiled locally on macOS runner).
            Install `monopoly-banker-preview.ipa` onto registered test devices.
          files: monopoly-banker-preview.ipa
