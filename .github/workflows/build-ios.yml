name: Build & Release iOS (Local, On-Demand)

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build profile (production or preview)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      upload_to_testflight:
        description: 'Upload compiled IPA to Apple TestFlight directly from runner'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create or update GitHub Releases

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify EXPO_TOKEN is present
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set in GitHub repository secrets. Please add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm config set legacy-peer-deps true
          npm install --legacy-peer-deps

      - name: Test & typecheck
        run: npm test && npm run typecheck

      - name: Setup App Store Connect API Key (if provided)
        id: asc-key-setup
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            echo "Configuring App Store Connect API Key for local signing and TestFlight submission..."
            mkdir -p ~/.appstoreconnect/private_keys
            KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            echo "$ASC_PRIVATE_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            echo "EXPO_ASC_API_KEY_ID=$ASC_KEY_ID" >> $GITHUB_ENV
            echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID" >> $GITHUB_ENV
            echo "EXPO_ASC_API_KEY_PATH=$KEY_FILE" >> $GITHUB_ENV
            echo "has_asc_key=true" >> $GITHUB_OUTPUT
          else
            echo "No App Store Connect API Key provided in secrets. Continuing with local build..."
            echo "has_asc_key=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build iOS IPA (Local runner)
        run: |
          PROFILE="${{ inputs.build_profile || 'production' }}"
          echo "Building iOS IPA locally on runner using profile: $PROFILE"
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output=monopoly-banker-ios.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: monopoly-banker-ios-ipa
          path: monopoly-banker-ios.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-ios-${{ github.run_number }}
          name: "iOS Build #${{ github.run_number }}"
          body: |
            Automated iOS IPA build from commit ${{ github.sha }} (compiled locally on macOS runner).
            Profile: `${{ inputs.build_profile || 'production' }}`
          files: monopoly-banker-ios.ipa

      - name: Upload to TestFlight (Direct from runner)
        if: ${{ inputs.upload_to_testflight && steps.asc-key-setup.outputs.has_asc_key == 'true' }}
        run: |
          echo "Submitting compiled IPA to TestFlight via App Store Connect API..."
          eas submit \
            --platform ios \
            --path monopoly-banker-ios.ipa \
            --profile production \
            --non-interactive

      - name: Cleanup temporary credentials
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys/AuthKey_*.p8 || true

